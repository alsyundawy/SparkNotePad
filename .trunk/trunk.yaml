# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
    - rust@1.82.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: cppcheck-qt
      files: [c/c++]
      commands:
        - name: lint
          run: 'cppcheck --language=c++ --library=qt --enable=warning,style,performance,portability --suppress=unusedStructMember --inline-suppr --quiet --template="{file}:{line}:{column}: [{id}] {message}" ${target}'
          output: regex
          parse_regex: (?P<path>.*):(?P<line>\d+):(?P<col>\d+):\s+\[(?P<code>[^\]]+)\]\s+(?P<message>.*)
          success_codes: [0]
          read_output_from: stderr
          batch: true
      environment:
        - name: PATH
          list: ["/Users/alsyundawy/Library/FlyEnv/env/node/bin", "${env.PATH}"]
      suggest_if: files_present
      known_good_version: 2.22.0
  disabled:
    - clang-tidy
  ignore:
    - linters: [ALL]
      paths:
        - i18n/**
        - thirdparty/**
        - build/**
        - build-test-fixtures/**
        - installer/**
        - deploy/windows/**
        - .trunk/**
        - src/languages/**
    - linters: [checkov]
      paths:
        - .github/workflows/create_release.yml
  enabled:
    - cppcheck-qt
    - pragma-once
    - clang-format@20.1.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.19
    - git-diff-check
    - isort@9.0.1
    - markdownlint@0.49.1
    - nixpkgs-fmt@1.3.0
    - oxipng@10.2.1
    - pinact@4.0.0
    - prettier@3.9.9
    - ruff@0.16.9
    - rustfmt@1.65.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - svgo@4.1.0
    - taplo@0.10.0
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
