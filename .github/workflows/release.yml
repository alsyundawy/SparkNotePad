            qt_arch: clang_64
            qt_version: "6.12"
            qt_install_version: "6.12"
            deployment_target: "14.0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
