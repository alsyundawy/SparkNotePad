name: Release New Build

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.4.6)"
        required: false
        default: "v1.4.6"

permissions:
  contents: write

env:
  # Qt version used for the canonical release DMG (must match one of the matrix qt_version values)
  QT_RELEASE_VER: "6.5"

jobs:
  # ─── Linux Ubuntu Matrix ───────────────────────────────────────────
  build-linux:
    name: build (linux, ${{ matrix.qt_version }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: gcc_64
            qt_version: "6.2"
            qt_install_version: "6.2"

          - runs_on: ubuntu-22.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: gcc_64
            qt_version: "6.5"
            qt_install_version: "6.5"

          - runs_on: ubuntu-22.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.8"
            qt_install_version: "6.8"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.10"
            qt_install_version: "6.10"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.11"
            qt_install_version: "6.11"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.12"
            qt_install_version: "6.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            rpm dpkg-dev
          if [ "${{ matrix.runs_on }}" = "ubuntu-22.04" ]; then
            sudo apt-get install -y --no-install-recommends g++-12 gcc-12
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ matrix.qt_install_version }}
          host: linux
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: Set Distribution (linux)
        shell: bash
        run: echo "DISTRIBUTION=native" >> "$GITHUB_ENV"

      - name: Configure (CMake)
        shell: bash
        run: |
          echo "Configure: run=$GITHUB_RUN_ID runner=${{ matrix.runs_on }} qt=${{ matrix.qt_version }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}" -DPKG_QT_SUFFIX="qt${{ matrix.qt_version }}"

      - name: Build
        shell: bash
        run: cmake --build build -j2

      - name: Build Linux Targets (deb, rpm)
        shell: bash
        run: |
          cmake --build build --target deb || true
          cmake --build build --target rpm || true
          if [ "${{ matrix.qt_version }}" = "${{ env.QT_RELEASE_VER }}" ]; then
            for f in build/*-qt${{ matrix.qt_version }}_*.deb; do
              [ -f "$f" ] && cp -v "$f" "${f//-qt${{ matrix.qt_version }}/}" || true
            done
            for f in build/*-qt${{ matrix.qt_version }}-1.*.rpm; do
              [ -f "$f" ] && cp -v "$f" "${f//-qt${{ matrix.qt_version }}/}" || true
            done
          fi

      - name: Upload Linux Packages (.deb, .rpm)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SparkNotePad-Linux-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: warn
          retention-days: 90

      - name: Publish Linux Packages Immediately to GitHub Release
        if: |
          always() && !cancelled() &&
          github.repository == 'alsyundawy/SparkNotePad' &&
          (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_VER=$(grep -E "set\(APP_VERSION" CMakeLists.txt | cut -d'"' -f2)
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            TAG="v${{ github.ref_name }}"
          elif [ -n "$PROJECT_VER" ]; then
            TAG="v${PROJECT_VER}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.4.0")
          fi
          echo "Target Release: ${TAG}"
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --title "${TAG}" --generate-notes || true
          find build \( -name "*.deb" -o -name "*.rpm" \) | while IFS= read -r pkg; do
            if [ -f "${pkg}" ]; then
              echo "🚀 Immediately publishing to release ${TAG}: ${pkg}"
              gh release upload "${TAG}" "${pkg}" --clobber || true
            fi
          done

  # ─── Linux Ubuntu ARM64 Matrix ────────────────────────────────────
  build-linux-arm64:
    name: build (linux-arm64, ${{ matrix.qt_version }})
    needs: [build-linux]
    if: always() && !cancelled()
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            cmake_arch: aarch64
            qt_arch: linux_gcc_arm64
            qt_version: "6.8"
            qt_install_version: "6.8"

          - runs_on: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            cmake_arch: aarch64
            qt_arch: linux_gcc_arm64
            qt_version: "6.10"
            qt_install_version: "6.10"

          - runs_on: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            cmake_arch: aarch64
            qt_arch: linux_gcc_arm64
            qt_version: "6.11"
            qt_install_version: "6.11"

          - runs_on: ubuntu-24.04-arm
