              gh release upload "${TAG}" "${pkg}" --clobber || true
            fi
          done

  # ─── macOS Intel x64 Matrix (PRIORITAS 1) ──────────────────────────
  build-macos-x64:
    name: build (macos-x64, ${{ matrix.qt_version }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets['APPLE_CERTIFICATE_BASE64'] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-15-intel
