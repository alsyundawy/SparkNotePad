          echo "Target Release: ${TAG}"
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --title "${TAG}" --generate-notes || true
          for dmg in build/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "🚀 Immediately publishing to release ${TAG}: ${dmg}"
              gh release upload "${TAG}" "${dmg}" --clobber || true
            fi
          done

  # ─── GitHub Release Job ────────────────────────────────────────────
  github:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-linux, build-linux-arm64, build-macos-x64, build-macos-arm64]
    if: |
      always() && !cancelled() &&
      github.repository == 'alsyundawy/SparkNotePad' &&
      (
        github.ref_type == 'tag' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve Release Tag
        shell: bash
        run: |
          PROJECT_VER=$(grep -E "set\(APP_VERSION" CMakeLists.txt | cut -d'"' -f2)
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            TAG="v${{ github.ref_name }}"
          elif [ -n "$PROJECT_VER" ]; then
            TAG="v${PROJECT_VER}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.4.0")
          fi
          echo "Resolved release tag: ${TAG}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Create or Verify Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES_PATH=""
          for candidate in "doc/RELEASE_NOTES_${RELEASE_TAG}.md" "doc/RELEASE_NOTES_${RELEASE_TAG}_en.md" "DOCNOTE.md"; do
            if [ -f "$candidate" ]; then
              RELEASE_NOTES_PATH="$candidate"
              break
            fi
          done

          if [ -n "$RELEASE_NOTES_PATH" ]; then
            echo "Publishing release with rich notes: $RELEASE_NOTES_PATH"
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --title "SparkNotePad $RELEASE_TAG Official Release" --notes-file "$RELEASE_NOTES_PATH"
            else
              gh release create "$RELEASE_TAG" --title "SparkNotePad $RELEASE_TAG Official Release" --notes-file "$RELEASE_NOTES_PATH"
            fi
          else
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
              gh release create "$RELEASE_TAG" \
                --title "$RELEASE_TAG" \
                --generate-notes
          fi

      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Upload Release Assets (macOS DMG)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Downloaded artifact directories ==="
          ls -la
          find . -name "*.dmg" | while IFS= read -r dmg_file; do
            echo "Uploading macOS DMG: ${dmg_file} → release ${RELEASE_TAG}"
            gh release upload "${RELEASE_TAG}" "${dmg_file}" --clobber || true
          done

      - name: Upload Linux Packages (.deb, .rpm)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find . \( -name "*.deb" -o -name "*.rpm" \) | while IFS= read -r pkg; do
            echo "Uploading Linux package: ${pkg}"
            gh release upload "${RELEASE_TAG}" "${pkg}" --clobber || true
          done

      - name: Upload Default Editor Scripts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for script in "SparkNotePad-Default-Editor.sh" "SparkNotePad-Default-Editor-Linux.sh" "scripts/SparkNotePad-Default-Editor.sh" "scripts/SparkNotePad-Default-Editor-Linux.sh"; do
            if [ -f "${script}" ]; then
              echo "Uploading ${script} to release ${RELEASE_TAG}"
              gh release upload "${RELEASE_TAG}" "${script}" --clobber || true
            fi
          done
